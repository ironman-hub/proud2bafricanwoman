<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Proud2bAfricanWoman</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c1834">
<link rel="icon" href="/img/logo-black.png">
<link rel="preload" href="/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-layout="none">
<div class="admin" id="app" hidden>
  <aside class="admin-side">
    <a href="/" class="brand"><img src="/img/logo-white.png" alt="" style="height:38px"><b>Proud2b<i style="color:var(--gold-soft)">African</i>Woman</b></a>
    <nav>
      <button data-tab="overview" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Overview</span></button>
      <button data-tab="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Products</span></button>
      <button data-tab="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span>Photos</span></button>
      <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16v13H4zM4 7l2-3h12l2 3M9 11h6"/></svg><span>Orders</span></button>
      <button data-tab="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.6 5"/></svg><span>Customers</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>Settings</span></button>
    </nav>
    <div class="bottom">
      <a href="/" target="_blank">View shop ↗</a>
      <button id="logout">Log out</button>
    </div>
  </aside>
  <main class="admin-main" id="main"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box"><h3 id="m-title"></h3><p class="muted" id="m-text"></p><div class="acts"><button class="btn btn-ghost btn-sm" id="m-no">Cancel</button><button class="btn btn-danger btn-sm" id="m-yes">Delete</button></div></div></div>

<script src="js/app.js"></script>
<script>
P2B.ready.then(({ user, config }) => {
  if (!user) { location.href = '/account?next=/admin'; return; }
  if (!user.isAdmin) { document.body.innerHTML = '<div class="wrap" style="padding:80px 20px;text-align:center"><h1 class="serif">Admins only</h1><p><a class="link" href="/">Back to shop</a></p></div>'; return; }
  document.getElementById('app').hidden = false;
  const { esc, money, api, toast } = P2B;
  const main = document.getElementById('main');
  const cats = config.categories;
  const catName = s => (cats.find(c => c.slug === s) || {}).name || s;
  let products = [], editing = null;

  function confirmBox(title, text, yes = 'Delete') {
    return new Promise(res => {
      const m = document.getElementById('modal');
      document.getElementById('m-title').textContent = title; document.getElementById('m-text').textContent = text; document.getElementById('m-yes').textContent = yes;
      m.classList.add('open');
      const done = v => { m.classList.remove('open'); res(v); };
      document.getElementById('m-yes').onclick = () => done(true);
      document.getElementById('m-no').onclick = () => done(false);
    });
  }

  const date = d => new Date(d + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const payWarn = !config.paymentsEnabled ? `<div class="alert"><b>Card payments are not switched on yet.</b> Add your Stripe secret key to the server settings (see README) to accept payments. Until then, customers can still order through WhatsApp.</div>` : '';


  // Shrink large photos in the browser before upload (keeps uploads fast and under the 4MB limit)
  async function shrink(file, max = 2000) {
    try {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type) || (file.size < 1.5e6)) return file;
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
      return blob ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
    } catch (e) { return file; }
  }

  // ---------- Overview ----------
  async function overview() {
    const s = await api('/api/admin/stats');
    const orders = (await api('/api/admin/orders')).slice(0, 6);
    main.innerHTML = `
      <div class="admin-top"><div><span class="eyebrow">Dashboard</span><h1>Welcome, <em>${esc(user.name.split(' ')[0])}</em></h1></div>
        <button class="btn btn-primary" data-goto="products">+ Add a product</button></div>
      ${payWarn}
      ${s.photosEnabled === false ? '<div class="alert"><b>Photo uploads are not switched on yet.</b> In Vercel, open this project → Storage → create a <b>Blob</b> store and connect it, then redeploy.</div>' : ''}
      <div class="stats">
        <div class="stat"><span>Revenue</span><b>${money(s.revenue)}</b></div>
        <div class="stat"><span>Orders</span><b>${s.orders}</b></div>
        <div class="stat"><span>To ship</span><b>${s.toShip}</b></div>
        <div class="stat"><span>Products</span><b>${s.products}</b></div>
      </div>
      <div class="panel"><h3>Latest orders</h3>${orders.length ? ordersTable(orders) : '<p class="muted">No paid orders yet. They will appear here as soon as customers pay.</p>'}</div>`;
  }

  // ---------- Products ----------
  function productForm(p) {
    return `
    <form class="panel" id="pform" style="position:sticky;top:20px">
      <h3>${p ? 'Edit product' : 'Add a new product'}</h3>
      <div class="form-err" id="perr"></div>
      <label class="dropzone" id="dz">
        ${p && p.image ? `<img src="${esc(p.image)}" alt="">` : ''}
        <div class="hint" ${p && p.image ? 'style="display:none"' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><b>Add product photo</b>Click or drag a picture here (JPG, PNG, WEBP)</div>
        <input type="file" name="image" accept="image/*" id="pimg" aria-label="Product photo">
      </label>
      <div class="field"><label for="pname">Product name</label><input class="input" id="pname" name="name" required value="${esc(p ? p.name : '')}" placeholder="e.g. Map of Africa Earrings"></div>
      <div class="row2">
        <div class="field"><label for="pprice">Price (£)</label><input class="input" id="pprice" name="price" inputmode="decimal" required value="${p ? (p.price / 100).toFixed(2) : ''}" placeholder="12.99"></div>
        <div class="field"><label for="pcat">Category</label><select class="select" id="pcat" name="category" required><option value="">Choose…</option>${cats.map(c => `<option value="${c.slug}" ${p && p.category === c.slug ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="pdesc">Description</label><textarea class="input" id="pdesc" name="description" placeholder="Tell customers what makes this piece special — materials, size, care…">${esc(p ? p.description : '')}</textarea></div>
      <div style="display:flex;gap:22px;margin:4px 0 20px;flex-wrap:wrap">
        <label class="check"><input type="checkbox" id="pstock" ${!p || p.in_stock ? 'checked' : ''}> In stock</label>
        <label class="check"><input type="checkbox" id="pfeat" ${p && p.featured ? 'checked' : ''}> Bestseller / featured</label>
      </div>
      <button class="btn btn-primary btn-block" id="psave">${p ? 'Save changes' : 'Publish product'}</button>
      ${p ? '<button type="button" class="btn btn-ghost btn-block" style="margin-top:8px" id="pcancel">Cancel editing</button>' : ''}
    </form>`;
  }

  function productRows() {
    const q = (document.getElementById('psearch') || {}).value || '';
    const fc = (document.getElementById('pfilter') || {}).value || '';
    const list = products.filter(p => (!fc || p.category === fc) && (!q || p.name.toLowerCase().includes(q.toLowerCase())));
    document.getElementById('plist').innerHTML = list.length ? list.map(p => `
      <div class="prod-row">
        <img src="${esc(p.image || '/img/ndop.jpg')}" alt="">
        <div><h4>${esc(p.name)}</h4><small>${esc(catName(p.category))} · ${p.in_stock ? 'In stock' : '<b style="color:var(--danger)">Sold out</b>'}${p.featured ? ' · ★ Featured' : ''}</small></div>
        <div class="price">${money(p.price)}</div>
        <div class="row-actions"><button data-edit="${p.id}">Edit</button><button data-stock="${p.id}">${p.in_stock ? 'Mark sold out' : 'Back in stock'}</button><button class="del" data-del="${p.id}">Delete</button></div>
      </div>`).join('') : '<div class="empty-state"><div class="serif" style="font-size:28px">No products here yet</div><p class="muted">Use the form to add your first one.</p></div>';
  }

  async function productsTab() {
    products = await api('/api/products?sort=new&limit=500');
    main.innerHTML = `
      <div class="admin-top"><div><span class="eyebrow">Catalogue</span><h1>Products</h1></div><span class="muted">${products.length} product${products.length === 1 ? '' : 's'} live</span></div>
      <div class="admin-split">
        <div id="formwrap">${productForm(editing)}</div>
        <div>
          <div class="list-tools"><input class="input" id="psearch" placeholder="Search products…" aria-label="Search products"><select class="select" id="pfilter" aria-label="Filter by category"><option value="">All categories</option>${cats.map(c => `<option value="${c.slug}">${esc(c.name)}</option>`).join('')}</select></div>
          <div class="prod-list" id="plist"></div>
        </div>
      </div>`;
    productRows(); bindForm();
    document.getElementById('psearch').oninput = productRows;
    document.getElementById('pfilter').onchange = productRows;
  }

  function bindForm() {
    const dz = document.getElementById('dz'), inp = document.getElementById('pimg');
    const show = file => {
      if (!file) return;
      let img = dz.querySelector('img'); if (!img) { img = document.createElement('img'); dz.prepend(img); }
      img.src = URL.createObjectURL(file); dz.querySelector('.hint').style.display = 'none';
    };
    inp.onchange = () => show(inp.files[0]);
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', e => { if (e.dataTransfer.files[0]) { inp.files = e.dataTransfer.files; show(inp.files[0]); } });
    const cancel = document.getElementById('pcancel');
    if (cancel) cancel.onclick = () => { editing = null; document.getElementById('formwrap').innerHTML = productForm(null); bindForm(); };
    document.getElementById('pform').onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById('perr'), btn = document.getElementById('psave');
      err.classList.remove('show');
      const fd = new FormData();
      fd.append('name', document.getElementById('pname').value);
      fd.append('price', document.getElementById('pprice').value);
      fd.append('category', document.getElementById('pcat').value);
      fd.append('description', document.getElementById('pdesc').value);
      fd.append('in_stock', document.getElementById('pstock').checked ? 'true' : 'false');
      fd.append('featured', document.getElementById('pfeat').checked ? 'true' : 'false');
      if (inp.files[0]) fd.append('image', await shrink(inp.files[0]));
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await api(editing ? `/api/admin/products/${editing.id}` : '/api/admin/products', { method: editing ? 'PUT' : 'POST', body: fd });
        toast(editing ? 'Product updated ✓' : 'Product published to your shop ✓');
        editing = null; productsTab();
      } catch (ex) { err.textContent = ex.message; err.classList.add('show'); btn.disabled = false; btn.textContent = editing ? 'Save changes' : 'Publish product'; }
    };
  }


  // ---------- Photos (homepage & category images) ----------
  async function photosTab() {
    const cfg = await api('/api/config');
    const slots = [
      ['Homepage slideshow', [['img_hero1', 'Slide 1'], ['img_hero2', 'Slide 2'], ['img_hero3', 'Slide 3']], '16/7', 'Wide landscape photos work best (at least 2000 × 900 px).'],
      ['Category pictures', cfg.categories.map(c => ['img_cat_' + c.slug, c.name]), '1/1', 'Square photos, at least 900 × 900 px.'],
      ['Collection banners', [['img_banner1', 'Banner 1 (Clothing)'], ['img_banner2', 'Banner 2 (Jewellery)']], '7/5', 'Landscape photos, at least 1400 × 1000 px.'],
    ];
    main.innerHTML = `<div class="admin-top"><div><span class="eyebrow">Your shop's look</span><h1>Photos</h1></div></div>
      <p class="muted" style="margin-top:-14px;margin-bottom:26px">Click <b>Change photo</b> to upload your own picture. The website updates straight away. <b>Reset</b> brings back the original photo.</p>
      ${slots.map(([title, items, ratio, tip]) => `
        <div class="panel" style="margin-bottom:22px"><h3>${title}</h3><p class="muted" style="margin:-8px 0 18px;font-size:13.5px">${tip}</p>
          <div class="media-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(${ratio === '1/1' ? 170 : 260}px,1fr));gap:16px">
          ${items.map(([k, label]) => `
            <div>
              <div style="aspect-ratio:${ratio};background:#eee;overflow:hidden;margin-bottom:8px"><img id="pv-${k}" src="${esc(cfg.images[k] || '')}" alt="" style="width:100%;height:100%;object-fit:cover"></div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap"><b style="font-size:13.5px">${esc(label)}</b>
                <span style="display:flex;gap:6px;width:100%"><label class="btn btn-sm btn-primary" style="cursor:pointer;flex:1;padding:0 10px">Change<input type="file" accept="image/*" data-slot="${k}" hidden></label><button class="btn btn-sm btn-ghost" style="padding:0 12px" data-reset="${k}">Reset</button></span></div>
            </div>`).join('')}
          </div></div>`).join('')}`;
  }
  document.addEventListener('change', async e => {
    const inp = e.target.closest('[data-slot]'); if (!inp || !inp.files[0]) return;
    const fd = new FormData(); fd.append('image', await shrink(inp.files[0]));
    try { const r = await api('/api/admin/media/' + encodeURIComponent(inp.dataset.slot), { method: 'POST', body: fd }); document.getElementById('pv-' + inp.dataset.slot).src = r.url; toast('Photo updated ✓'); }
    catch (ex) { toast(esc(ex.message), true); }
  });
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-reset]'); if (!b) return;
    try { const r = await api('/api/admin/media/' + encodeURIComponent(b.dataset.reset), { method: 'DELETE' }); document.getElementById('pv-' + b.dataset.reset).src = r.url; toast('Original photo restored'); }
    catch (ex) { toast(esc(ex.message), true); }
  });

  // ---------- Orders ----------
  function ordersTable(orders) {
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${orders.map(o => `<tr>
        <td><b>#${o.id}</b><br><small class="muted">${date(o.created_at)}</small></td>
        <td>${esc(o.customer_name || '')}<br><small class="muted">${esc(o.email || '')}</small>${o.address ? `<br><small class="muted">${esc(o.address)}</small>` : ''}</td>
        <td>${o.items.map(i => `${i.qty} × ${esc(i.name)}`).join('<br>')}</td>
        <td><b>${money(o.total)}</b>${o.shipping ? `<br><small class="muted">incl. ${money(o.shipping)} shipping</small>` : ''}</td>
        <td><select class="select" data-status="${o.id}" aria-label="Order status">${['paid', 'shipped', 'cancelled'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('')}</select></td>
      </tr>`).join('')}</tbody></table></div>`;
  }
  async function ordersTab() {
    const orders = await api('/api/admin/orders');
    main.innerHTML = `<div class="admin-top"><div><span class="eyebrow">Sales</span><h1>Orders</h1></div></div>${payWarn}
      ${orders.length ? ordersTable(orders) : '<div class="empty-state"><div class="serif" style="font-size:30px">No orders yet</div><p class="muted">Paid orders appear here automatically, with the customer\'s delivery address.</p></div>'}`;
  }

  // ---------- Customers ----------
  async function customersTab() {
    const [list, subs] = await Promise.all([api('/api/admin/customers'), api('/api/admin/subscribers')]);
    main.innerHTML = `<div class="admin-top"><div><span class="eyebrow">Community</span><h1>Customers</h1></div><span class="muted">${list.length} registered</span></div>
      ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead><tbody>${list.map(c => `<tr><td>${esc(c.name)}</td><td><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></td><td>${date(c.created_at)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No customer accounts yet.</p>'}
      <div class="admin-top" style="margin-top:40px"><div><h1 style="font-size:32px">Mailing list</h1></div><span class="muted">${subs.length} subscriber${subs.length === 1 ? '' : 's'}</span></div>
      ${subs.length ? `<div class="panel"><textarea class="input" readonly style="min-height:100px">${esc(subs.map(x => x.email).join(', '))}</textarea><p class="muted" style="font-size:13px">Copy these addresses into your email tool (e.g. Mailchimp) to send news and offers.</p></div>` : '<p class="muted">Nobody has joined the mailing list yet.</p>'}`;
  }

  // ---------- Settings ----------
  async function settingsTab() {
    const s = await api('/api/admin/settings');
    const pounds = v => (+v / 100).toFixed(2);
    const f = (k, label, ph = '', val = s[k]) => `<div class="field"><label for="s-${k}">${label}</label><input class="input" id="s-${k}" name="${k}" value="${esc(val || '')}" placeholder="${ph}"></div>`;
    main.innerHTML = `<div class="admin-top"><div><span class="eyebrow">Your shop</span><h1>Settings</h1></div></div>
      <form id="sform" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start">
        <div class="panel"><h3>Contact</h3>
          ${f('whatsapp', 'WhatsApp number (with country code)', '447123456789')}
          <p class="muted" style="font-size:12.5px;margin-top:-8px">Digits only, no + or spaces. UK example: 447123456789</p>
          ${f('email', 'Email')}${f('phone', 'Phone (optional)')}
          ${f('hours', 'Business hours (separate lines with ·)')}
          ${f('announcement', 'Top banner messages (separate with ·)')}
          ${f('hero_title', 'Homepage headline')}
          ${f('hero_subtitle', 'Homepage sub-headline')}
        </div>
        <div class="panel"><h3>Social media</h3>
          ${f('facebook', 'Facebook page link', 'https://facebook.com/yourpage')}
          ${f('tiktok', 'TikTok link', 'https://tiktok.com/@yourname')}
          ${f('instagram', 'Instagram link', 'https://instagram.com/yourname')}
          ${f('youtube', 'YouTube link', 'https://youtube.com/@yourchannel')}
          ${f('x', 'X (Twitter) link', 'https://x.com/yourname')}
          <p class="muted" style="font-size:12.5px">Leave a box empty to hide that icon.</p>
        </div>
        <div class="panel"><h3>Shipping (£)</h3>
          ${f('shipping_uk', 'UK Royal Mail', '4.45', pounds(s.shipping_uk))}
          ${f('shipping_eu', 'Europe', '6.95', pounds(s.shipping_eu))}
          ${f('shipping_world', 'Rest of world', '12.95', pounds(s.shipping_world))}
          ${f('free_shipping_over', 'Free UK delivery over (0 = off)', '75.00', pounds(s.free_shipping_over))}
          <button class="btn btn-primary btn-block" style="margin-top:8px">Save settings</button>
        </div>
      </form>`;
    document.getElementById('sform').onsubmit = async e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      try { await api('/api/admin/settings', { method: 'PUT', body }); toast('Settings saved ✓'); } catch (ex) { toast(esc(ex.message), true); }
    };
  }

  const tabs = { overview, products: productsTab, photos: photosTab, orders: ordersTab, customers: customersTab, settings: settingsTab };
  function go(tab) {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    main.innerHTML = '<p class="muted">Loading…</p>';
    tabs[tab]().catch(e => { main.innerHTML = `<div class="alert">${esc(e.message)}</div>`; });
    history.replaceState(null, '', '#' + tab); scrollTo(0, 0);
  }

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-tab],[data-goto],[data-edit],[data-del],[data-stock]');
    if (!t) return;
    if (t.dataset.tab) go(t.dataset.tab);
    else if (t.dataset.goto) go(t.dataset.goto);
    else if (t.dataset.edit) {
      editing = products.find(p => p.id === +t.dataset.edit);
      document.getElementById('formwrap').innerHTML = productForm(editing); bindForm(); scrollTo({ top: 0, behavior: 'smooth' });
    } else if (t.dataset.stock) {
      const p = products.find(p => p.id === +t.dataset.stock); const fd = new FormData(); fd.append('in_stock', p.in_stock ? 'false' : 'true');
      await api(`/api/admin/products/${p.id}`, { method: 'PUT', body: fd }); toast(p.in_stock ? 'Marked as sold out' : 'Back in stock ✓'); productsTab();
    } else if (t.dataset.del) {
      const p = products.find(p => p.id === +t.dataset.del);
      if (await confirmBox('Delete this product?', `“${p.name}” will be removed from your shop straight away. This can't be undone.`)) {
        try { await api(`/api/admin/products/${p.id}`, { method: 'DELETE' }); toast('Product deleted'); if (editing && editing.id === p.id) editing = null; productsTab(); }
        catch (ex) { toast(esc(ex.message), true); }
      }
    }
  });
  document.addEventListener('change', async e => {
    const s = e.target.closest('[data-status]'); if (!s) return;
    try { await api(`/api/admin/orders/${s.dataset.status}`, { method: 'PATCH', body: { status: s.value } }); toast(`Order #${s.dataset.status} marked ${s.value}`); } catch (ex) { toast(esc(ex.message), true); }
  });
  document.getElementById('logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); location.href = '/'; };

  go(tabs[location.hash.slice(1)] ? location.hash.slice(1) : 'overview');
});
</script>
</body>
</html>
